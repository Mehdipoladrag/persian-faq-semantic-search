<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار هوشمند صندوق نوآوری</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 85vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #2c3e50;
            color: white;
            padding: 1.5rem;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .chat-header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.bot {
            align-items: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 0.75rem 1rem;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .user .bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot .bubble {
            background: white;
            color: #2c3e50;
            border: 1px solid #ddd;
            border-bottom-left-radius: 4px;
        }

        .sources {
            font-size: 0.7rem;
            color: #6c757d;
            margin-top: 0.25rem;
            margin-right: 0.5rem;
        }

        .typing {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0.5rem 1rem;
            background: #e9ecef;
            border-radius: 20px;
            width: fit-content;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #6c757d;
            border-radius: 50%;
            animation: blink 1.4s infinite both;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }

        .input-area {
            padding: 1rem;
            background: white;
            border-top: 1px solid #dee2e6;
            display: flex;
            gap: 0.5rem;
        }

        .input-area input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ced4da;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 0.75rem 1.5rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .input-area button:hover {
            background: #5a67d8;
        }

        .input-area button:disabled {
            background: #adb5bd;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1> دستیار هوشمند صندوق نوآوری</h1>
            <p>بر اساس پرسش‌های متداول (FAQ)</p>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="bubble">
                    سلام! من دستیار هوشمند صندوق نوآوری و شکوفایی هستم. هر سوالی درباره خدمات، ضمانت‌نامه، کمک‌های بلاعوض، و سرمایه‌گذاری دارید، بپرسید.
                </div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="questionInput" placeholder="سوال خود را بنویسید..." autocomplete="off">
            <button id="sendBtn">ارسال</button>
        </div>
    </div>
<script>
    // تابع دریافت CSRF token از کوکی
    function getCSRFToken() {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, 10) === 'csrftoken=') {
                    cookieValue = decodeURIComponent(cookie.substring(10));
                    break;
                }
            }
        }
        return cookieValue;
    }

    const chatDiv = document.getElementById('chatMessages');
    const input = document.getElementById('questionInput');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(role, text, sources = null) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerText = text;
        messageDiv.appendChild(bubble);
        if (sources && sources.length) {
            const sourceSpan = document.createElement('div');
            sourceSpan.className = 'sources';
            sourceSpan.innerText = `منابع: ${sources.join(', ')}`;
            messageDiv.appendChild(sourceSpan);
        }
        chatDiv.appendChild(messageDiv);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function showTyping() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message bot';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
        chatDiv.appendChild(typingDiv);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function removeTyping() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();
    }

    async function sendQuestion() {
        const question = input.value.trim();
        if (!question) return;

        sendBtn.disabled = true;
        input.disabled = true;

        addMessage('user', question);
        input.value = '';
        showTyping();

        try {
            const response = await fetch('/ask/', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken()  // اضافه کردن CSRF token
                },
                body: JSON.stringify({ query: question })
            });
            
            const data = await response.json();
            removeTyping();
            
            if (response.ok) {
                addMessage('bot', data.answer, data.sources);
            } else {
                addMessage('bot', data.error || 'خطا در ارتباط با سرور. لطفاً دوباره تلاش کنید.');
            }
        } catch (error) {
            removeTyping();
            addMessage('bot', 'خطای شبکه. مطمئن شوید سرور در حال اجراست.');
        } finally {
            sendBtn.disabled = false;
            input.disabled = false;
            input.focus();
        }
    }

    sendBtn.addEventListener('click', sendQuestion);
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendQuestion();
    });
</script>
</body>
</html>
