<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار هوشمند صندوق نوآوری</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated background particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .chat-container {
            width: 95%;
            max-width: 1000px;
            height: 90vh;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem 2rem;
            text-align: center;
            position: relative;
        }

        .chat-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="40" r="3" fill="rgba(255,255,255,0.1)"/><circle cx="50" cy="70" r="2" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
            opacity: 0.3;
        }

        .chat-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .chat-header h1 i {
            font-size: 2rem;
        }

        .chat-header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);
        }

        /* Custom scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #e9ecef;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .message {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-items: flex-end;
        }

        .message.bot {
            align-items: flex-start;
        }

        .bubble {
            max-width: 70%;
            padding: 0.875rem 1.25rem;
            border-radius: 20px;
            word-wrap: break-word;
            line-height: 1.5;
            position: relative;
            transition: all 0.2s ease;
        }

        .user .bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 5px rgba(102,126,234,0.3);
        }

        .bot .bubble {
            background: white;
            color: #2c3e50;
            border: 1px solid #dee2e6;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .bot .bubble:hover {
            transform: translateX(2px);
        }

        .sources {
            font-size: 0.7rem;
            color: #6c757d;
            margin-top: 0.25rem;
            margin-right: 0.5rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .sources i {
            font-size: 0.65rem;
        }

        .typing {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0.75rem 1.25rem;
            background: white;
            border-radius: 20px;
            width: fit-content;
            border: 1px solid #dee2e6;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: blink 1.4s infinite both;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }

        .input-area {
            padding: 1rem 1.5rem;
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            padding: 0.875rem 1.25rem;
            border: 1px solid #dee2e6;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
            background: #f8f9fa;
        }

        .input-area input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .input-area button {
            padding: 0.875rem 1.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-area button i {
            font-size: 1rem;
        }

        .input-area button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .input-area button:disabled {
            background: #adb5bd;
            transform: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="chat-container">
        <div class="chat-header">
            <h1>
                <i class="fas fa-robot"></i>
                دستیار هوشمند صندوق نوآوری
            </h1>
            <p>پاسخگوی سوالات شما بر اساس پرسش‌های متداول (FAQ)</p>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="bubble">
                    <i class="fas fa-comment-dots" style="margin-left: 8px;"></i>
                    سلام! من دستیار هوشمند صندوق نوآوری و شکوفایی هستم. هر سوالی درباره خدمات، ضمانت‌نامه، کمک‌های بلاعوض، و سرمایه‌گذاری دارید، بپرسید.
                </div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="questionInput" placeholder="سوال خود را بنویسید..." autocomplete="off">
            <button id="sendBtn">
                <i class="fas fa-paper-plane"></i>
                ارسال
            </button>
        </div>
    </div>

    <script>
        // Create particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for(let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 5 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 20 + 10 + 's';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particlesContainer.appendChild(particle);
            }
        }
        createParticles();

        function getCSRFToken() {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, 10) === 'csrftoken=') {
                        cookieValue = decodeURIComponent(cookie.substring(10));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        const chatDiv = document.getElementById('chatMessages');
        const input = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(role, text, sources = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            if (role === 'bot') {
                bubble.innerHTML = `<i class="fas fa-robot" style="margin-left: 8px;"></i>${text}`;
            } else {
                bubble.innerHTML = `${text}<i class="fas fa-user" style="margin-right: 8px;"></i>`;
            }
            
            messageDiv.appendChild(bubble);
            if (sources && sources.length) {
                const sourceSpan = document.createElement('div');
                sourceSpan.className = 'sources';
                sourceSpan.innerHTML = `<i class="fas fa-database"></i> منابع: ${sources.join(', ')}`;
                messageDiv.appendChild(sourceSpan);
            }
            chatDiv.appendChild(messageDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `<div class="typing"><i class="fas fa-microchip" style="margin-left: 8px; opacity: 0.6;"></i><span></span><span></span><span></span></div>`;
            chatDiv.appendChild(typingDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        function removeTyping() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        async function sendQuestion() {
            const question = input.value.trim();
            if (!question) return;

            sendBtn.disabled = true;
            input.disabled = true;

            addMessage('user', question);
            input.value = '';
            showTyping();

            try {
                const response = await fetch('/ask/', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCSRFToken()
                    },
                    body: JSON.stringify({ query: question })
                });
                
                const data = await response.json();
                removeTyping();
                
                if (response.ok) {
                    addMessage('bot', data.answer, data.sources);
                } else {
                    addMessage('bot', data.error || 'خطا در ارتباط با سرور. لطفاً دوباره تلاش کنید.');
                }
            } catch (error) {
                removeTyping();
                addMessage('bot', 'خطای شبکه. مطمئن شوید سرور در حال اجراست.');
            } finally {
                sendBtn.disabled = false;
                input.disabled = false;
                input.focus();
            }
        }

        sendBtn.addEventListener('click', sendQuestion);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendQuestion();
        });
    </script>
</body>
</html>
